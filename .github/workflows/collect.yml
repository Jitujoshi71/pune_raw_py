name: Build Pune Raw Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    name: Fresh Pune Raw Data
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # SYSTEM INFO
      # ======================================================

      - name: System information
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PUNE RAW DATA BUILD"
          echo "=============================================="

          echo
          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # SYSTEM TOOLS
      # ======================================================

      - name: Install system tools
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALLING TOOLS"
          echo "=============================================="

          sudo apt-get update

          sudo apt-get install -y \
            osmium-tool \
            curl \
            ca-certificates

          echo
          echo "OSMIUM:"
          osmium --version

          echo
          echo "GH:"
          gh --version | head -n 1

          echo
          echo "PYTHON:"
          python --version

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python -m pip install \
            --upgrade \
            pip

          python -m pip install \
            -r requirements.txt

      # ======================================================
      # DIRECTORY
      # ======================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf data
          rm -rf release

          mkdir -p data/raw/source
          mkdir -p data/raw/osm
          mkdir -p data/raw/dem
          mkdir -p data/raw/opencity
          mkdir -p data/tmp
          mkdir -p release

      # ======================================================
      # SYNTAX
      # ======================================================

      - name: Validate Python
        shell: bash
        run: |
          set -e

          python -m py_compile collector.py

          echo
          echo "Python syntax validation PASSED."

      # ======================================================
      # RUN
      # ======================================================

      - name: Run fresh collector
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "STARTING FRESH COLLECTOR"
          echo "=============================================="

          python collector.py

      # ======================================================
      # FINAL VALIDATION
      # ======================================================

      - name: Validate final release
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL VALIDATION"
          echo "=============================================="

          test -s data/raw/osm/central-zone.osm.pbf
          test -s data/raw/dem/N18E073.hgt.gz
          test -s data/raw/dem/N18E074.hgt.gz
          test -s data/raw/dem/N19E073.hgt.gz
          test -s data/raw/dem/N19E074.hgt.gz

          test -s release/manifest.json
          test -s release/SHA256SUMS.txt

          echo
          echo "PUNE OSM:"
          ls -lh \
            data/raw/osm/central-zone.osm.pbf

          echo
          echo "DEM:"
          ls -lh \
            data/raw/dem/

          echo
          echo "MANIFEST:"
          ls -lh \
            release/manifest.json \
            release/SHA256SUMS.txt

          echo
          echo "OSM FILEINFO:"
          osmium fileinfo \
            --extended \
            data/raw/osm/central-zone.osm.pbf

      # ======================================================
      # RELEASE ASSETS
      # ======================================================

      - name: Show release assets
        if: always()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "GITHUB RELEASE ASSETS"
          echo "=============================================="

          gh release view \
            pune-raw-v1 \
            --json assets \
            --jq \
            '.assets[] |
            "\(.name)  \(.size) bytes"'

      # ======================================================
      # DISK REPORT
      # ======================================================

      - name: Final disk report
        if: always()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "FINAL DISK"
          echo "=============================================="

          df -h

          echo
          echo "RAW DATA:"
          du -sh \
            data/raw \
            2>/dev/null || true

          echo
          echo "OSM:"
          ls -lh \
            data/raw/osm \
            2>/dev/null || true

          echo
          echo "DEM:"
          ls -lh \
            data/raw/dem \
            2>/dev/null || true

          echo
          echo "OPENCITY:"
          find data/raw/opencity \
            -type f \
            -printf \
            '%p  %s bytes\n' \
            2>/dev/null || true

          echo
          echo "=============================================="
          echo "WORKFLOW FINISHED"
          echo "=============================================="
